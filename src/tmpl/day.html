<div class="day-view-header d-flex align-items-center mb-3">
    <button class="btn btn-outline-secondary btn-back-to-calendar me-3">&larr; Calendar</button>
    <h3 class="mb-0 flex-grow-1">{{dateLabel}}</h3>
    <button class="btn btn-primary btn-add-record">+ Add Entry</button>
</div>

<div class="row">
    <div class="col-md-5 col-lg-4">
        <div class="card time-records">
            <div class="card-header d-flex flex-row">
                <div class="align-self-start flex-fill fw-semibold">Work Entries</div>
                <div class="align-self-end flex-fill text-end">
                    {{#if user.is_admin}}
                        <button class="btn btn-danger btn-sm btn-remove-all">Remove All</button>
                    {{/if}}
                </div>
            </div>
            <div class="list-group list-group-flush record-list">
                <div class="list-group-item text-muted fst-italic">Loading…</div>
            </div>
        </div>
    </div>
    <div class="col-md-7 col-lg-8">
        <div class="record-detail"></div>
    </div>
</div>

<div class="modal fade" id="confirm-delete-modal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
            </div>
            <div class="modal-body">
                <p class="confirm-delete-message mb-0"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-confirm-cancel" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger btn-confirm-proceed">Proceed</button>
            </div>
        </div>
    </div>
</div>
