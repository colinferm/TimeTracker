<div class="card">
    <div class="card-header fw-semibold">
        {{#if record.id}}Edit Entry{{else}}New Entry{{/if}}
    </div>
    <div class="card-body">
        <div class="form-floating mb-3">
            <select name="client_id" id="record-client" class="form-control" required>
                <option value="">-- Select Client --</option>
            </select>
            <label for="record-client">Client <span class="text-danger">*</span></label>
        </div>
        <div class="form-floating mb-3">
            <select name="project_id" id="record-project" class="form-control">
                <option value="">-- No project --</option>
            </select>
            <label for="record-project">Project</label>
        </div>
        <div class="form-floating mb-3">
            <input type="datetime-local" name="work_date" id="record-work-date" class="form-control" value="{{record.work_date}}" placeholder=" " required>
            <label for="record-work-date">Date &amp; Time <span class="text-danger">*</span></label>
        </div>
        <div class="form-floating mb-3">
            <input type="number" name="num_hours" id="record-num-hours" class="form-control" value="{{record.num_hours}}" min="0.1" max="24" step="0.5" placeholder="1.0" required>
            <label for="record-num-hours">Hours <span class="text-danger">*</span></label>
        </div>
        <div class="form-floating mb-3">
            <textarea name="work_desc" id="record-work-desc" class="form-control" placeholder="Description" style="height: 100px">{{record.work_desc}}</textarea>
            <label for="record-work-desc">Description</label>
        </div>
        <div class="d-flex justify-content-end gap-2">
            {{#if user.is_admin}}
                {{#if record.id}}<button class="btn btn-danger btn-delete-record me-auto">Delete</button>{{/if}}
            {{/if}}
            <button class="btn btn-secondary btn-cancel-record">Cancel</button>
            <button class="btn btn-success btn-save-record">Save</button>
        </div>
    </div>
</div>
