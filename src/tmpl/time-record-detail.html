<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-semibold">Entry Details</span>
        <button class="btn btn-sm btn-outline-dark btn-edit-record">Edit</button>
    </div>
    <div class="card-body">
        <dl class="row mb-0">
            <dt class="col-sm-4">Client</dt>
            <dd class="col-sm-8">{{record.client_name}}</dd>

            <dt class="col-sm-4">Project</dt>
            <dd class="col-sm-8">{{#if record.project_name}}{{record.project_name}}{{else}}&mdash;{{/if}}</dd>

            <dt class="col-sm-4">Date &amp; Time</dt>
            <dd class="col-sm-8">{{record.work_date}}</dd>

            <dt class="col-sm-4">Hours</dt>
            <dd class="col-sm-8">{{record.num_hours}}</dd>

            <dt class="col-sm-4">Description</dt>
            <dd class="col-sm-8">{{record.work_desc}}</dd>
        </dl>
    </div>
</div>
