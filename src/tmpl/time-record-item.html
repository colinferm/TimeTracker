<a class="list-group-item list-group-item-action time-record-item" data-id="{{record.id}}" style="border: {{record.color}} 2px solid;">
    <div class="d-flex justify-content-between align-items-start">
        <span class="fw-semibold">{{record.client_name}}</span>
        <small class="text-muted text-nowrap ms-2">{{record.start_time}} – {{record.end_time}}</small>
    </div>
    {{#if record.project_name}}
    <small class="text-muted">{{record.project_name}}</small><br>
    {{/if}}
    <small class="text-truncate d-block" style="max-width:100%;">{{record.work_desc}}</small>
</a>
